[MGISMART]
CLOUD_HEADING="Cloud-Anbindung"
CLOUD_HINT="Zustand der Verbindung zur SAIC-Cloud, gelesen aus den Statusmeldungen, die das Gateway selbst per MQTT veröffentlicht. Ein laufender Prozess allein bedeutet noch nicht, dass die Anmeldung funktioniert - deshalb steht hier, ob sie tatsächlich geklappt hat."
CLOUD_CONNECTION="Verbindung"
CLOUD_LAST_LOGIN="Letzte erfolgreiche Anmeldung"
CLOUD_LAST_ERROR="Letzter Anmeldefehler"
CLOUD_GW_VERSION="Version laut Gateway"
CLOUD_STATE_ONLINE="Online"
CLOUD_STATE_OFFLINE="Offline"
CLOUD_STATE_NOANSWER="Keine Antwort vom Broker"
CLOUD_STATE_LOGINFAILED="Anmeldung fehlgeschlagen - Benutzername oder Passwort prüfen"
CLOUD_STATE_NOTCONFIGURED="Noch kein iSMART-Zugang hinterlegt"
CLOUD_NEVER="Noch nie"

TOPIC_HEADING="Anbindung an den Miniserver"
TOPIC_HINT="Das MQTT Gateway V2 erkennt die Topics des Gateways von selbst — es muss nichts eingetragen werden. In den Subscriptions erscheinen die Fahrzeugdaten unter der unten genannten Topic-Gruppe; dort hakst du einzeln die Datenpunkte an, die an den Miniserver gehen sollen."
TOPIC_SUBSCRIBE="Topic-Gruppe"
TOPIC_SUBSCRIBE_HELP="Unter diesem Namen findest du die Fahrzeugdaten in den Subscriptions des MQTT Gateways. Erscheint die Gruppe dort nicht, hat das Gateway noch nichts veröffentlicht — dann zuerst oben den Prozessstatus und die Cloud-Anbindung prüfen."
TOPIC_OPEN_SUBSCRIPTIONS="Subscriptions des MQTT Gateways öffnen"
TOPIC_COMMANDS_HINT="Befehle an das Fahrzeug werden ebenfalls über MQTT gesendet, auf Topics mit der Endung /set unterhalb desselben Präfix. Welche Befehle es gibt und welche Werte sie erwarten, steht in der Dokumentation des Plugins: https://wiki.loxberry.de/plugins/mgismart/start"

WARN_TITLE="Sicherheitshinweis"
WARN_BODY="Über dieses Plugin lassen sich Befehle an das Fahrzeug senden — unter anderem Ver- und Entriegeln, Klimatisierung und Laden. Die empfangenen Daten enthalten zudem die Geokoordinaten, also den jeweils aktuellen Standort des Fahrzeugs. Wer Zugriff auf diese Daten oder auf die hinterlegten Zugangsdaten erhält, kann das Fahrzeug orten und steuern. Gib die Daten nicht weiter, veröffentliche die MQTT-Topics nicht ins Internet und sichere den Zugang zu LoxBerry und zum Miniserver entsprechend ab."
WARN_LIABILITY="Die Nutzung erfolgt vollständig auf eigenes Risiko. Für Schäden, Datenverlust, Missbrauch, Fehlfunktionen des Fahrzeugs oder Folgen aus abgesetzten Befehlen wird keinerlei Haftung übernommen — weder durch die Autoren dieses Plugins noch durch das LoxBerry-Projekt. Das Plugin steht in keiner Verbindung zu MG, SAIC oder Loxone."
PIN_ENTER="Diese Seite enthält die Zugangsdaten zum Fahrzeug. Bitte zum Fortfahren die LoxBerry SecurePIN eingeben."
PIN_OK="OK"
PIN_CHECKING="SecurePIN wird geprüft…"
PIN_WRONG="Falsche SecurePIN."
PIN_LOCKED="Zu viele Fehlversuche. Die SecurePIN ist für einige Minuten gesperrt."
PIN_FAILED="Die Prüfung der SecurePIN ist fehlgeschlagen."
PIN_WHY_TITLE="Warum eine PIN?"
PIN_WHY_BODY="Mit den hier hinterlegten Zugangsdaten lässt sich das Fahrzeug orten und fernsteuern. Die SecurePIN schützt sie zusätzlich zur LoxBerry-Anmeldung."

SET_SECTION_ACCOUNT="iSMART-Zugang"
SET_ACCOUNT_HINT="Zugangsdaten des iSMART-Kontos, mit dem das Fahrzeug verknüpft ist - dieselben wie in der iSMART-App. Das Passwort wird im Klartext gespeichert, weil das Gateway es zur Anmeldung an der Cloud benötigt."
SET_USER="Benutzername"
SET_USER_HELP="E-Mail-Adresse oder Telefonnummer des iSMART-Kontos."
SET_PASSWORD="Passwort"
SET_PASSWORD_SHOW="Passwort anzeigen"
SET_PASSWORD_HIDE="Passwort verbergen"
SET_REGION="Region"
SET_REGION_EU="Europa"
SET_REGION_AU="Australien / Neuseeland"
SET_REGION_TR="Türkei"
SET_REGION_HELP="Bestimmt, welcher Cloud-Endpunkt angesprochen wird."
SET_COUNTRYCODE="Telefon-Ländervorwahl"
SET_COUNTRYCODE_HELP="Nur nötig, wenn der Benutzername eine Telefonnummer statt einer E-Mail-Adresse ist, zum Beispiel 49 für Deutschland."

SET_SECTION_MQTT="MQTT"
SET_MQTT_HINT="Broker, Benutzer und Passwort werden bei jedem Start automatisch von LoxBerry übernommen und sind deshalb hier nicht einstellbar. Eine Änderung an den Broker-Zugangsdaten wirkt also schon beim nächsten Neustart des Gateways."
SET_TOPIC="Topic-Präfix"
SET_TOPIC_HELP="Erster Teil aller Topics. Das Gateway hängt den Benutzernamen und darunter die Fahrzeuge an. Vorgabe: saic"
SET_HADISCOVERY="Home-Assistant-Discovery"
SET_HADISCOVERY_HELP="Nur einschalten, wenn am selben Broker auch Home Assistant hängt. Sonst werden lediglich große Mengen an Konfigurations-Topics veröffentlicht, die für Loxone keinen Nutzen haben."
SET_LOGLEVEL="Loglevel des Gateways"
SET_LOGLEVEL_HELP="Ergibt sich aus dem Loglevel dieses Plugins und ist deshalb hier nicht einstellbar. Ändern lässt er sich im Plugin-Management von LoxBerry; er wird beim nächsten Start des Gateways übernommen."

SET_SECTION_POLLING="Abfrageintervalle"
SET_POLLING_HINT="Wie oft das Gateway den Fahrzeugstatus aus der Cloud holt. Leer bedeutet: es gilt der Wert im Platzhalter. Ein ruhendes Fahrzeug wird automatisch seltener abgefragt - nach 24 Stunden ohne Statusänderung höchstens alle 12 Stunden, nach 48 Stunden höchstens einmal täglich. Solange das Ladekabel steckt, bleibt es beim eingestellten Intervall, damit eine geplante Nachtladung nicht übersehen wird. Kurze Intervalle wecken die Fahrzeugelektronik häufiger und belasten die 12-V-Batterie."
SET_REFRESHINACTIVE="Ruhendes Fahrzeug (Sek.)"
SET_REFRESHINACTIVE_HELP="Abstand, in dem ein abgestelltes Fahrzeug abgefragt wird. Vorgabe 3600 (eine Stunde). Das Gateway selbst würde nur einmal täglich fragen - zu selten, um eine Nachtladung noch am Morgen zu sehen."
SET_REFRESHACTIVE="Aktives Fahrzeug (Sek.)"
SET_REFRESHACTIVE_HELP="Abstand während der Fahrt und beim Laden."
SET_REFRESHSHUTDOWN="Nach dem Abstellen (Sek.)"
SET_REFRESHSHUTDOWN_HELP="Abstand während der Nachlaufzeit, unmittelbar nachdem das Fahrzeug abgestellt wurde."
SET_REFRESHGRACE="Nachlaufzeit (Sek.)"
SET_REFRESHGRACE_HELP="Wie lange nach dem Abstellen noch im kurzen Abstand abgefragt wird, bevor das Fahrzeug als ruhend gilt."

SET_SECTION_ADVANCED="Erweitert"
SET_ADVANCED_HINT="Alle Felder sind optional. Leer bedeutet: es gilt die Vorgabe des Gateways, die im Platzhalter steht."
SET_RELOGIN="Relogin-Verzögerung (Sek.)"
SET_RELOGIN_HELP="Das Gateway erkennt Anmeldungen von anderen Geräten, etwa der iSMART-App, und pausiert danach für diese Zeit."
SET_MESSAGES="Nachrichten-Intervall (Sek.)"
SET_MESSAGES_HELP="Abstand, in dem Fahrzeugnachrichten aus der Cloud abgeholt werden."
SET_ACCOUNTREFRESH="Konto-Aktualisierung (Sek.)"
SET_ACCOUNTREFRESH_HELP="Abstand, in dem Fahrzeugliste und Zeitzone des Kontos neu geladen werden."
SET_CHARGEMIN="Ladefortschritt-Schwelle (%)"
SET_CHARGEMIN_HELP="Um wie viele Prozentpunkte sich der Ladestand ändern muss, bevor erneut abgefragt wird."
SET_BATTERY="Batteriekapazität"
SET_BATTERY_HELP="Zuordnung von Fahrgestellnummer zu Kapazität in kWh, mehrere durch Komma getrennt, zum Beispiel LSJXXXX=54.0,LSJYYYY=64.0"
SET_TIMEZONE="Zeitzone"
SET_TIMEZONE_HELP="Überschreibt die Zeitzone des Kontos, falls die Cloud eine falsche liefert. IANA-Name wie Europe/Berlin."
SET_ALLOWDOTS="Punkte im Topic zulassen"
SET_ALLOWDOTS_HELP="Der Benutzername ist Teil des Topic-Pfads und enthält als E-Mail-Adresse meist Punkte. Ausgeschaltet werden sie durch Unterstriche ersetzt, was für Loxone die saubereren Namen ergibt. Achtung: Umschalten ändert sämtliche Topic-Namen."
SET_EXTRAENV="Zusätzliche Umgebungsvariablen"
SET_EXTRAENV_HELP="Je Zeile ein Eintrag der Form KEY=VALUE, für Optionen des Gateways, die das Plugin nicht anbietet - etwa ABRP, OsmAnd oder OpenWB. Schlüssel, die das Plugin selbst schreibt, werden abgelehnt."

UPG_HEADING="Gateway-Software"
UPG_HINT="Das Plugin betreibt die Software saic-python-mqtt-gateway, die getrennt vom Plugin veröffentlicht wird. Hier lässt sie sich installieren und aktualisieren."
UPG_CHANNEL="Update-Kanal"
UPG_CHANNEL_RELEASE="Nur Releases"
UPG_CHANNEL_PRERELEASE="Releases und Vorabversionen"
UPG_CHANNEL_HELP="Vorabversionen enthalten Neuerungen früher, sind aber weniger erprobt."
UPG_LABEL_CURRENT="Installierte Version"
UPG_LABEL_AVAILABLE="Verfügbare Version"
UPG_BUTTON="Aktualisieren"
UPG_BUTTON_INSTALL="Installieren"
UPG_CHECK_BUTTON="Jetzt prüfen"
UPG_HINT_RESTART="Die Aktualisierung lädt die neue Version und baut die Python-Umgebung neu auf. Erst wenn das vollständig geklappt hat, wird umgeschaltet - schlägt etwas fehl, bleibt die bisherige Installation unverändert. Danach wird das Gateway automatisch neu gestartet, sofern es nicht von Hand gestoppt wurde."
