[AUTHOR]
# NEVER CHANGE this information in future updates! LoxBerry uses it to identify
# the plugin and to handle updates. Changing it makes LoxBerry treat this as a
# different plugin and updates will fail.
NAME=Michael Schlenstedt
EMAIL=michael@loxberry.de

[PLUGIN]
# The version of this plugin.
VERSION=1.0

# Short name and preferred subfolder. If the name already exists on the
# installation system, LoxBerry appends 01, 02, ... - therefore no script may
# ever assume the literal folder name. NEVER CHANGE these two values.
NAME=mgismart
FOLDER=mgismart

# Friendly long name, 25 characters maximum.
TITLE=MG iSMART
WEBSITE=https://wiki.loxberry.de/plugins/mgismart/start

[AUTOUPDATE]
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/mschlenstedt/LoxBerry-Plugin-MGiSMART/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/mschlenstedt/LoxBerry-Plugin-MGiSMART/main/prerelease.cfg

[SYSTEM]
# No reboot needed: the plugin installs no udev rule and no system service.
REBOOT=false

LB_MINIMUM=4.0.0
LB_MAXIMUM=false

# No architecture-specific parts. The gateway is pure Python; its dependencies
# ship as wheels for the platforms LoxBerry 4 supports.
ARCHITECTURE=""

# The plugin log level drives the log level of the gateway process, so the user
# needs the selector in the plugin management widget.
CUSTOM_LOGLEVELS=true

# Plugin Interface
INTERFACE=2.0
