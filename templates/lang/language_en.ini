[MGISMART]
CLOUD_HEADING="Cloud connection"
CLOUD_HINT="State of the connection to the SAIC cloud, read from the status messages the gateway publishes over MQTT itself. A running process alone does not mean the login works - so this is where you see whether it actually did."
CLOUD_CONNECTION="Connection"
CLOUD_LAST_LOGIN="Last successful login"
CLOUD_LAST_ERROR="Last login error"
CLOUD_GW_VERSION="Version reported by the gateway"
CLOUD_STATE_ONLINE="Online"
CLOUD_STATE_OFFLINE="Offline"
CLOUD_STATE_NOANSWER="No answer from the broker"
CLOUD_STATE_LOGINFAILED="Login failed - check the user name and password"
CLOUD_STATE_NOTCONFIGURED="No iSMART account configured yet"
CLOUD_NEVER="Never"

TOPIC_HEADING="Connecting to the Miniserver"
TOPIC_HINT="The gateway publishes the vehicle data below the topic shown here. For the values to reach the Miniserver, this topic has to be subscribed in the LoxBerry MQTT Gateway - the plugin deliberately does not change that configuration for you."
TOPIC_SUBSCRIBE="Topic to subscribe"
TOPIC_SUBSCRIBE_HELP="Enter it exactly like this under Subscriptions in the MQTT Gateway. The trailing # includes everything below it - vehicle data, account status and the gateway's own availability message."
TOPIC_COMMANDS_HINT="Commands to the vehicle are sent over MQTT as well, on topics ending in /set below the same prefix. The available commands and their value ranges are documented with saic-python-mqtt-gateway."

SET_SECTION_ACCOUNT="iSMART account"
SET_ACCOUNT_HINT="Credentials of the iSMART account the vehicle is registered to - the same ones you use in the iSMART app. The password is stored in clear text because the gateway needs it to log in to the cloud."
SET_USER="User name"
SET_USER_HELP="E-mail address or phone number of the iSMART account."
SET_PASSWORD="Password"
SET_PASSWORD_SHOW="Show password"
SET_PASSWORD_HIDE="Hide password"
SET_REGION="Region"
SET_REGION_EU="Europe"
SET_REGION_AU="Australia / New Zealand"
SET_REGION_TR="Türkiye"
SET_REGION_HELP="Selects which cloud endpoint is used."
SET_COUNTRYCODE="Phone country code"
SET_COUNTRYCODE_HELP="Only needed when the user name is a phone number rather than an e-mail address, for example 49 for Germany."

SET_SECTION_MQTT="MQTT"
SET_MQTT_HINT="Broker, user and password are taken from LoxBerry on every start and therefore cannot be set here. A change to the broker credentials takes effect with the next gateway restart."
SET_TOPIC="Topic prefix"
SET_TOPIC_HELP="First part of every topic. The gateway appends the account name and the vehicles below it. Default: saic"
SET_HADISCOVERY="Home Assistant discovery"
SET_HADISCOVERY_HELP="Only enable this if Home Assistant uses the same broker. Otherwise it merely publishes a large number of configuration topics that are of no use to Loxone."
SET_LOGLEVEL="Gateway log level"
SET_LOGLEVEL_HELP="Derived from this plugin's log level and therefore not set here. Change it in the LoxBerry plugin management; it is applied the next time the gateway starts."

SET_SECTION_ADVANCED="Advanced"
SET_ADVANCED_HINT="Every field is optional. Empty means the gateway's own default applies, which is shown as the placeholder."
SET_RELOGIN="Relogin delay (sec)"
SET_RELOGIN_HELP="The gateway detects logins from other devices such as the iSMART app and pauses for this long afterwards."
SET_MESSAGES="Message interval (sec)"
SET_MESSAGES_HELP="How often vehicle messages are fetched from the cloud."
SET_ACCOUNTREFRESH="Account refresh (sec)"
SET_ACCOUNTREFRESH_HELP="How often the vehicle list and the account time zone are reloaded."
SET_CHARGEMIN="Charge progress threshold (%)"
SET_CHARGEMIN_HELP="By how many percentage points the state of charge has to change before it is queried again."
SET_BATTERY="Battery capacity"
SET_BATTERY_HELP="Mapping of vehicle identification number to capacity in kWh, several separated by commas, for example LSJXXXX=54.0,LSJYYYY=64.0"
SET_TIMEZONE="Time zone"
SET_TIMEZONE_HELP="Overrides the account time zone when the cloud reports a wrong one. IANA name such as Europe/Berlin."
SET_ALLOWDOTS="Allow dots in the topic"
SET_ALLOWDOTS_HELP="The user name is part of the topic path and, being an e-mail address, usually contains dots. With this off they are replaced by underscores, which gives cleaner names in Loxone. Careful: switching this renames every topic."
SET_EXTRAENV="Additional environment variables"
SET_EXTRAENV_HELP="One KEY=VALUE entry per line, for gateway options the plugin does not expose - ABRP, OsmAnd or OpenWB for instance. Keys the plugin writes itself are rejected."

UPG_HEADING="Gateway software"
UPG_HINT="The plugin runs saic-python-mqtt-gateway, which is released independently of this plugin. Install and update it here."
UPG_CHANNEL="Update channel"
UPG_CHANNEL_RELEASE="Releases only"
UPG_CHANNEL_PRERELEASE="Releases and prereleases"
UPG_CHANNEL_HELP="Prereleases bring new features earlier but are less well tested."
UPG_LABEL_CURRENT="Installed version"
UPG_LABEL_AVAILABLE="Available version"
UPG_BUTTON="Update"
UPG_BUTTON_INSTALL="Install"
UPG_CHECK_BUTTON="Check now"
UPG_HINT_RESTART="The update downloads the new version and rebuilds the Python environment. It only switches over once all of that has succeeded - if anything fails, the previous installation is left untouched. The gateway is then restarted automatically unless it was stopped by hand."
UPG_MSG_NOVERSION="unknown"
UPG_HINT_AVAILABLE="A newer version is available."
UPG_HINT_UPTODATE="The software is up to date."
UPG_HINT_NOVERSION="The versions could not be determined. Is the LoxBerry online?"
UPG_HINT_NOTINSTALLED="The gateway software is not installed yet."
UPG_HINT_CHECKING="Checking for updates…"
UPG_HINT_UPGRADING="The installation is running. This takes a few minutes - you can leave this page open."
UPG_HINT_OK="Done."
UPG_HINT_ERROR="Failed. See the update log file for details."

LOG_HINT="gateway is the output of the gateway process itself, watchdog records starts, stops and supervision, update the installation runs."

